[project]
name = "cmu-leg"
version = "0.1.0"
description = "Python software stack for the CMU Prosthetic Leg"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.6",
    "pyserial>=3.5",
    "pysoem>=1.1.13",
    "scipy>=1.17.1",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "pytest>=9.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmu_leg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
